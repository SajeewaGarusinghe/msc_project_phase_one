name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install
        run: uv sync --extra dev
      - name: Create the A4 users (sealer and arm)
        run: scripts/a4_users.sh
      - name: Unit tests and the A4 boundary tests
        env:
          PROVRCA_REQUIRE_A4: "1"   # A4-T1 fails, never skips, if the boundary cannot be built
        run: uv run pytest -q
      - name: The build guide's P1 and A4 tests, named
        env:
          PROVRCA_REQUIRE_A4: "1"
        run: |
          uv run pytest -q -k "d0_identity" --no-header   # P1-T4
          uv run pytest -q -k "a4"         --no-header    # A4-T1, A4-T2
