[project]
name = "provrca-bench"
version = "0.1.0"
description = "FrameBench, ProvRCA and the comparator arms for 'Verifying Telemetry Before Trusting It'"
requires-python = ">=3.12"
dependencies = [
    # RCAEval is pinned to an exact version. The build guide asks for a commit pin, which the
    # published distribution cannot support: rcaeval-1.12.0.dist-info/METADATA declares no
    # Home-page and no Project-URL, so there is no repository to pin to. The exact version plus
    # the hashes in uv.lock is the strongest pin available from PyPI; the project's archived copy
    # of the package (proposal section 07) is what a commit pin would otherwise provide.
    "rcaeval==1.12.0",
    "pydantic>=2.9,<3",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "scikit-learn>=1.4", "networkx", "requests", "tqdm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provrca_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
