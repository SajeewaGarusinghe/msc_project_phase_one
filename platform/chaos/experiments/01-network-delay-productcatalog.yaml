# ---------------------------------------------------------------------------
# GROUND TRUTH:   product-catalog is slow (injected 300ms +/- 100ms)
# INTENDED VICTIM: frontend and checkout p99 latency
#
# Why this one is first: it produces the clean caller/callee latency asymmetry
# that the Phase 7 provenance verifier depends on. The caller's CLIENT span
# observes the full delay; the callee's SERVER span does not. Any claim by the
# callee that contradicts that relationship is detectable without trusting the
# callee -- which is the defence in miniature.
# ---------------------------------------------------------------------------
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay-productcatalog
  namespace: chaos-mesh          # never in `app` -- see platform/rbac/
  annotations:
    bench.msc/root-cause: "product-catalog"
    bench.msc/intended-victim: "frontend,checkout"
    bench.msc/fault-class: "network-latency"
spec:
  action: delay
  mode: all
  selector:
    namespaces: [app]
    labelSelectors:
      app.kubernetes.io/component: product-catalog
  delay:
    latency: "300ms"
    correlation: "50"
    jitter: "100ms"
  direction: to
  duration: "10m"
