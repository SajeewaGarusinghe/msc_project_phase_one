# ---------------------------------------------------------------------------
# The identity the RCA agent under test runs as.
#
# THIS FILE IS THE EXPERIMENT'S INTERNAL VALIDITY, EXPRESSED AS KUBERNETES RBAC.
#
# The SREGym paper observes that in AIOpsLab and ITBench the fault injectors
# "run as identifiable pods in the same environment the agent inspects", and
# reports that 8 of 18 ITBench mitigation problems can be "solved" by a generic
# pod-restart loop that never diagnoses anything. An agent that can read the
# chaos CRD is not performing root cause analysis, and any attack measured
# against such an agent measures nothing.
#
# Three properties are deliberate and must not be relaxed:
#
#   1. NAMESPACED Roles only -- never a ClusterRole. A ClusterRole with
#      read-only verbs would still let the agent list every namespace and find
#      `chaos-mesh`.
#   2. No binding in the chaos-mesh namespace at all. Not a restricted one: none.
#   3. No access to the chaos-mesh.org API group anywhere. Even a "get" on a
#      single NetworkChaos leaks the ground truth.
#
# Verified by scripts/verify.sh, which fails the build if any of these holds.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rca-agent
  namespace: research
  labels:
    bench.msc/role: "agent-under-test"
  annotations:
    bench.msc/doc: "Read-only access to app + observability. Never to chaos-mesh."
---
# --- application namespace: what a real SRE agent would legitimately see ----
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rca-agent-read
  namespace: app
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log        # kubectl logs -- the primary evidence channel
      - services
      - endpoints
      - events
      - configmaps
      - persistentvolumeclaims
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  # NOTE: pods/exec is NOT granted. With exec the agent could observe tc rules
  # and stress processes injected by Chaos Mesh inside the target pod, which is
  # a side-channel to the ground truth. If a future phase needs exec, the
  # recorder must filter its output first.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rca-agent-read
  namespace: app
subjects:
  - kind: ServiceAccount
    name: rca-agent
    namespace: research
roleRef:
  kind: Role
  name: rca-agent-read
  apiGroup: rbac.authorization.k8s.io
---
# --- observability namespace: read-only, so the agent can reach the backends -
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rca-agent-read
  namespace: observability
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rca-agent-read
  namespace: observability
subjects:
  - kind: ServiceAccount
    name: rca-agent
    namespace: research
roleRef:
  kind: Role
  name: rca-agent-read
  apiGroup: rbac.authorization.k8s.io
---
# ===========================================================================
# INTENTIONALLY ABSENT, AND THE ABSENCE IS THE POINT:
#
#   - any ClusterRole / ClusterRoleBinding for rca-agent
#   - any Role or RoleBinding in namespace chaos-mesh
#   - any rule naming apiGroup "chaos-mesh.org"
#   - any rule granting "namespaces" list at cluster scope
#
# Adding any of these silently invalidates every experiment run afterwards.
# ===========================================================================
