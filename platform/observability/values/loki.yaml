# ---------------------------------------------------------------------------
# Loki -- single binary mode, filesystem storage.
#
# TWO SETTINGS HERE EXIST SPECIFICALLY FOR THIS PROJECT:
#
#   reject_old_samples: false
#     Loki normally refuses log lines with timestamps outside a recent window.
#     Phase 3 writes records with timestamps aligned to a past incident, and
#     Phase 2 may re-ingest captured data. With the default this silently drops
#     them and the forgery appears not to work.
#
#   unordered_writes: true
#     Planted records are written out of order relative to the genuine stream.
#
# Both are safe on a closed research bench and would be wrong in production.
# ---------------------------------------------------------------------------
deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    reject_old_samples: false
    reject_old_samples_max_age: 168h
    unordered_writes: true
    retention_period: 24h
    allow_structured_metadata: true

  # Accept OTLP natively so the collector needs no translation layer.
  server:
    http_listen_port: 3100

singleBinary:
  replicas: 1
  resources:
    limits:   { cpu: 1000m, memory: 2Gi }
    requests: { cpu: 200m,  memory: 512Mi }
  persistence:
    enabled: true
    size: 20Gi
    storageClass: "local-path"

# Disable every component that only exists in distributed mode.
read:      { replicas: 0 }
write:     { replicas: 0 }
backend:   { replicas: 0 }
gateway:   { enabled: false }
chunksCache:   { enabled: false }
resultsCache:  { enabled: false }
lokiCanary:    { enabled: false }
test:          { enabled: false }
monitoring:
  selfMonitoring: { enabled: false, grafanaAgent: { installOperator: false } }
