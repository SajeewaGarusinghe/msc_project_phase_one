# ---------------------------------------------------------------------------
# Tempo -- single binary (monolithic) mode.
#
# The distributed chart would run six components. On one node that is pure
# overhead. Single binary stores traces on a local PVC.
#
# 100% SAMPLING IS NON-NEGOTIABLE for this project. The P7 provenance verifier
# compares a callee's self-reported SERVER span against the caller's own CLIENT
# span. If sampling drops either side of that pair, the check silently has
# nothing to compare and the defence appears to fail for the wrong reason.
# ---------------------------------------------------------------------------
tempo:
  # Short retention: the durable artefact of this project is the captured
  # snapshot, not the live store. Long retention only costs memory and disk.
  retention: 6h

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  # No tail sampling, no probabilistic sampling, anywhere.
  overrides:
    defaults:
      ingestion:
        rate_limit_bytes: 30000000
        burst_size_bytes: 40000000

  # 100% sampling means Tempo ingests every span the app produces -- roughly
  # 10k in a 90s window on this bench. At a 2Gi limit it was OOMKilled into
  # CrashLoopBackOff, which surfaces only as a helm timeout.
  #
  # Raised rather than reducing sampling: the P7 verifier compares a callee's
  # SERVER span against its caller's CLIENT span, so dropping either side of a
  # pair silently breaks the defence being measured. Sampling is the one knob
  # that must not be touched to save memory.
  resources:
    limits:   { cpu: 2000m, memory: 3Gi }
    requests: { cpu: 200m,  memory: 1Gi }

persistence:
  enabled: true
  size: 20Gi
  storageClassName: "local-path"
