# ---------------------------------------------------------------------------
# Prometheus -- server only.
#
# kube-prometheus-stack is deliberately NOT used: it brings an operator, CRDs,
# Alertmanager, node-exporter and a second Grafana, which is roughly 1.5 GB of
# RAM this bench cannot spare and none of which this project needs.
#
# Two receivers are enabled, and both matter later:
#   - remote-write  : how the OTel Collector delivers application metrics
#   - (OTLP)        : newer Prometheus can ingest OTLP directly; the flag name
#                     has changed across 3.x releases, so it is NOT set here.
#                     Verify the flag for your image tag before enabling it.
# ---------------------------------------------------------------------------
server:
  extraFlags:
    - web.enable-remote-write-receiver
    # Admin API exposes the TSDB snapshot endpoint used by the P2 recorder.
    - web.enable-admin-api

  # Retention is short on purpose. The durable artefact of this project is the
  # captured snapshot, not the live TSDB. Long retention only costs disk.
  retention: "24h"

  resources:
    limits:   { cpu: 1000m, memory: 2Gi }
    requests: { cpu: 200m,  memory: 512Mi }

  persistentVolume:
    enabled: true
    size: 20Gi
    # k3s ships local-path as the default StorageClass.
    storageClass: "local-path"

  global:
    scrape_interval: 15s
    evaluation_interval: 15s

# Everything below is off: unused components are unused memory.
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
kube-state-metrics:
  enabled: true          # kept: pod/deployment state is useful RCA evidence
prometheus-node-exporter:
  enabled: true          # kept: node-level counters are an INDEPENDENT source
                         # (kernel-authored), which P7 relies on
